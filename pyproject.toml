[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fandom-wiki-mcp"
version = "0.1.0"
description = "MCP server for fetching data from any Fandom wiki"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.0",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
]

[project.scripts]
fandom-wiki-mcp = "fandom_wiki_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/fandom_wiki_mcp"]
